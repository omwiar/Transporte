<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Buscador de Flota</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior con pestañas; buscador en dos columnas (formulario fijo a la izquierda, resultados a la derecha) que se apilan en teléfono. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#152033; --muted:#5b6880; --line:#d5dbe5;
  --accent:#1d4fd7; --accent-ink:#ffffff; --accent-soft:#e4ebfd;
  --signal:#f2b705; --signal-ink:#3a2c00;
  --ok:#147a4b; --ok-soft:#dff3e8; --warn:#a85a00; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#fbe3e1;
  --track:#e3e8ef;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#19212d; --ink:#e8edf5; --muted:#9aa7bb; --line:#2e3948;
  --accent:#7ea2ff; --accent-ink:#0b1430; --accent-soft:#1f2c4a;
  --signal:#f2b705; --signal-ink:#3a2c00;
  --ok:#5fd29a; --ok-soft:#153325; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8f86; --bad-soft:#3d1a18;
  --track:#2a3442; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#19212d; --ink:#e8edf5; --muted:#9aa7bb; --line:#2e3948;
  --accent:#7ea2ff; --accent-ink:#0b1430; --accent-soft:#1f2c4a;
  --signal:#f2b705; --signal-ink:#3a2c00;
  --ok:#5fd29a; --ok-soft:#153325; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8f86; --bad-soft:#3d1a18;
  --track:#2a3442; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px;font-weight:700;letter-spacing:.01em}
h2{font-size:20px;font-weight:600}
h3{font-size:18px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.demo{display:inline-block;background:var(--signal);color:var(--signal-ink);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;margin-bottom:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-family:var(--display);font-weight:600;font-size:17px;text-decoration:none;color:var(--muted);padding:8px 14px;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.search{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.search{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.hint{font-size:12px;color:var(--muted);margin:0}

.results{display:flex;flex-direction:column;gap:12px;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.veh{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:12px 20px;align-items:center}
.veh.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@media (max-width:640px){.veh{grid-template-columns:minmax(0,1fr)}}
.veh .who{min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--track);color:var(--ink)}
.tag.best{background:var(--accent);color:var(--accent-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.spec{font-size:13px;color:var(--muted);margin-top:4px}
.bars{display:flex;flex-direction:column;gap:8px;min-width:0}
.bar{display:grid;grid-template-columns:58px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar i{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar span:last-child{text-align:right;color:var(--ink);font-weight:600}
.contact{font-size:13px;text-align:right}
@media (max-width:640px){.contact{text-align:left}}
.contact strong{display:block;font-size:16px;font-family:var(--display)}
.empty{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:14px 16px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.no{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.no:first-of-type{margin-top:10px}
.no span:last-child{color:var(--bad)}

.filters{display:flex;flex-wrap:wrap;gap:12px}
.filters label{flex:1 1 180px;max-width:260px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600}
th,td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.prov{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <span class="demo">Datos de ejemplo</span>
      <h1>Buscador de Flota</h1>
      <div class="muted">Proveedores, vehículos y tarifas inventados para mostrar cómo funcionaría la app.</div>
    </div>
    <nav id="nav">
      <a href="#buscar">Buscar</a>
      <a href="#flota">Flota</a>
      <a href="#proveedores">Proveedores</a>
    </nav>
  </header>

  <section id="v-buscar" class="search">
    <div class="panel">
      <form id="f">
        <h2>Carga del cliente</h2>
        <label for="peso">Peso total (kg)
          <input id="peso" type="number" min="0" step="50" value="1800">
        </label>
        <div>
          <div class="dims">
            <label for="largo">Largo (m)<input id="largo" type="number" min="0" step="0.1" value="3"></label>
            <label for="ancho">Ancho (m)<input id="ancho" type="number" min="0" step="0.1" value="1.8"></label>
            <label for="alto">Alto (m)<input id="alto" type="number" min="0" step="0.1" value="1.6"></label>
          </div>
          <p class="hint">Medidas del bulto completo. Deja en 0 lo que no sepas.</p>
        </div>
        <label for="tarimas">Tarimas (opcional)
          <input id="tarimas" type="number" min="0" step="1" value="0">
        </label>
        <label for="carro">Tipo de carrocería
          <select id="carro">
            <option value="">Cualquiera</option>
            <option value="Cerrado">Cerrado (incluye refrigerado)</option>
            <option value="Refrigerado">Refrigerado</option>
            <option value="Plataforma">Plataforma</option>
            <option value="Abierto">Abierto / estacas</option>
          </select>
        </label>
        <label for="zona">Tipo de viaje
          <select id="zona">
            <option value="">Cualquiera</option>
            <option>Local</option><option>Regional</option><option>Nacional</option>
          </select>
        </label>
        <label class="check" for="rampa"><input id="rampa" type="checkbox"> Necesita rampa hidráulica</label>
      </form>
    </div>
    <div class="results" id="res"></div>
  </section>

  <section id="v-flota" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="filters">
        <label for="ft">Tipo<select id="ft"></select></label>
        <label for="fp">Proveedor<select id="fp"></select></label>
      </div>
      <div class="scroll"><table id="tabla"></table></div>
      <p class="hint" id="cuenta"></p>
    </div>
  </section>

  <section id="v-proveedores" hidden>
    <div class="provs" id="provs"></div>
  </section>
</div>

<script>
const P = [
 {id:1,n:"Transportes El Cedro",c:"Marta Ruiz",t:"5550-0101",z:["Local","Regional"],pago:"Contado",cal:4.6},
 {id:2,n:"Fletes Rápidos del Norte",c:"Julio Paredes",t:"5550-0102",z:["Local"],pago:"Contado",cal:4.1},
 {id:3,n:"Logística Altamira",c:"Sofía Morales",t:"5550-0103",z:["Regional","Nacional"],pago:"Crédito 15 días",cal:4.8},
 {id:4,n:"Frío Express",c:"Andrés Lima",t:"5550-0104",z:["Local","Regional","Nacional"],pago:"Crédito 8 días",cal:4.5},
 {id:5,n:"Cargas Pesadas Montenegro",c:"Raúl Montenegro",t:"5550-0105",z:["Regional","Nacional"],pago:"50% anticipo",cal:4.3},
 {id:6,n:"Mudanzas y Fletes Sol",c:"Carla Estrada",t:"5550-0106",z:["Local"],pago:"Contado",cal:3.9}
];
// p: proveedor, tipo, modelo, año, placa, kg, largo, ancho, alto (m), tarimas, carrocería, rampa, tarifa/día, estado
const V = [
 [1,"Pickup","Nissan NP300",2021,"EJ-101",1000,2.3,1.5,1.2,1,"Abierto",0,65,1],
 [2,"Pickup","Toyota Hilux doble cabina",2022,"EJ-102",1000,1.5,1.5,1.2,1,"Abierto",0,70,1],
 [2,"Panel","Renault Kangoo",2023,"EJ-103",650,1.8,1.2,1.1,1,"Cerrado",0,55,1],
 [1,"Panel","Nissan Urvan carga",2020,"EJ-104",1200,2.8,1.5,1.3,2,"Cerrado",0,80,1],
 [6,"Van","Mercedes-Benz Sprinter",2022,"EJ-105",1400,4.3,1.7,1.9,4,"Cerrado",0,110,1],
 [2,"Camión 2.5 t","JAC 1040",2023,"EJ-106",2500,3.7,1.9,1.9,4,"Cerrado",0,125,1],
 [1,"Camión 3.5 t","Isuzu ELF 300",2021,"EJ-107",3500,4.3,2.0,2.1,6,"Cerrado",0,150,1],
 [6,"Camión 3.5 t","Hino 300 Serie 616",2020,"EJ-108",3500,4.5,2.1,2.2,6,"Cerrado",1,160,1],
 [6,"Camión 4 t","Chevrolet NPR",2020,"EJ-109",4000,5.0,2.2,2.3,8,"Cerrado",1,180,1],
 [6,"Camión 4.5 t","Hyundai HD78",2019,"EJ-110",4500,5.0,2.1,2.2,8,"Cerrado",0,185,0],
 [1,"Camión 4.5 t","Mitsubishi Fuso Canter",2018,"EJ-111",4500,5.2,2.1,2.2,8,"Abierto",0,175,1],
 [1,"Camión 5.5 t","Isuzu ELF 600",2019,"EJ-112",5500,6.0,2.3,2.3,10,"Cerrado",1,220,1],
 [3,"Camión 9 t","International MV",2021,"EJ-113",9000,7.0,2.4,2.4,12,"Plataforma",0,330,1],
 [3,"Camión 10 t","Freightliner M2 106",2020,"EJ-114",10000,7.3,2.4,2.5,14,"Cerrado",1,360,1],
 [3,"Camión 11 t","Hino 500 Serie 1726",2022,"EJ-115",11000,7.5,2.4,2.5,14,"Cerrado",0,380,1],
 [5,"Torton","Kenworth T370",2019,"EJ-116",15000,8.5,2.5,2.6,16,"Cerrado",0,460,1],
 [3,"Tráiler 48 pies","Kenworth T680",2020,"EJ-117",24000,14.5,2.5,2.7,24,"Cerrado",0,720,1],
 [3,"Tráiler 53 pies","Freightliner Cascadia",2021,"EJ-118",26000,16.0,2.5,2.7,26,"Cerrado",0,790,1],
 [5,"Tráiler plataforma","International LT",2019,"EJ-119",28000,14.6,2.5,2.6,24,"Plataforma",0,760,1],
 [5,"Cama baja (lowboy)","Kenworth T800",2017,"EJ-120",40000,12.0,3.0,3.0,0,"Plataforma",0,1250,1],
 [4,"Panel refrigerado","Peugeot Partner",2023,"EJ-121",600,1.8,1.2,1.1,1,"Refrigerado",0,85,1],
 [4,"Camión 3 t refrigerado","Isuzu ELF 400",2022,"EJ-122",3000,4.2,2.0,2.0,6,"Refrigerado",0,210,1],
 [4,"Camión 8 t refrigerado","Hino 500 Serie 1018",2021,"EJ-123",8000,7.0,2.3,2.3,12,"Refrigerado",1,420,1],
 [4,"Tráiler refrigerado 53 pies","Volvo VNL",2020,"EJ-124",24000,15.8,2.5,2.6,26,"Refrigerado",0,980,1]
].map(a=>({p:P.find(x=>x.id===a[0]),tipo:a[1],modelo:a[2],anio:a[3],placa:a[4],kg:a[5],l:a[6],a:a[7],h:a[8],tar:a[9],car:a[10],rampa:!!a[11],tarifa:a[12],activo:!!a[13],vol:a[6]*a[7]*a[8]}));

const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("es",{maximumFractionDigits:1});
const n=x=>nf.format(x);
const val=id=>Math.max(0,parseFloat($(id).value)||0);

function evaluar(v,q){
  if(!v.activo) return "En mantenimiento";
  if(q.car==="Cerrado" ? !(v.car==="Cerrado"||v.car==="Refrigerado") : (q.car && v.car!==q.car)) return "Carrocería: "+v.car.toLowerCase();
  if(q.rampa && !v.rampa) return "Sin rampa";
  if(q.zona && !v.p.z.includes(q.zona)) return "El proveedor no hace viajes "+q.zona.toLowerCase()+"es";
  if(q.peso>v.kg) return "Excede el peso ("+n(v.kg)+" kg máx.)";
  const L=Math.max(q.l,q.a), A=Math.min(q.l,q.a);   // la carga se puede girar
  if(L>v.l) return "Muy larga (caja de "+n(v.l)+" m)";
  if(A>v.a) return "Muy ancha (caja de "+n(v.a)+" m)";
  if(q.h>v.h) return "Muy alta (caja de "+n(v.h)+" m)";
  if(q.tar>0 && q.tar>v.tar) return "Solo caben "+v.tar+" tarimas";
  return "";
}
function buscar(){
  const q={peso:val("peso"),l:val("largo"),a:val("ancho"),h:val("alto"),tar:val("tarimas"),car:$("carro").value,zona:$("zona").value,rampa:$("rampa").checked};
  const vol=q.l*q.a*q.h;
  const si=[],no=[];
  V.forEach(v=>{
    const r=evaluar(v,q);
    if(r){no.push({v,r});return}
    const pp=q.peso/v.kg, pv=vol/v.vol, pt=q.tar&&v.tar?q.tar/v.tar:0;
    si.push({v,pp,pv,oc:Math.max(pp,pv,pt)});
  });
  si.sort((x,y)=>y.oc-x.oc||x.v.tarifa-y.v.tarifa);
  let h=`<div class="summary"><h2>${si.length} ${si.length===1?"vehículo disponible":"vehículos disponibles"}</h2>
    <span class="muted num">Carga: ${n(q.peso)} kg${vol?` · ${n(vol)} m³`:""}${q.tar?` · ${q.tar} tarimas`:""}</span></div>`;
  if(!si.length) h+=`<div class="empty"><strong>Ningún vehículo solo puede con esta carga.</strong> ${sugerir(q,vol)}</div>`;
  si.forEach((x,i)=>{
    const v=x.v;
    h+=`<article class="veh${i===0?" best":""}">
      <div class="who">
        <h3>${v.tipo} · ${v.modelo}</h3>
        <div class="spec num">${n(v.kg)} kg · caja ${n(v.l)} × ${n(v.a)} × ${n(v.h)} m · ${n(v.vol)} m³${v.tar?` · ${v.tar} tarimas`:""} · ${v.anio} · placa ${v.placa}</div>
        <div class="tags">${i===0?'<span class="tag best">Mejor ajuste</span>':""}<span class="tag">${v.car}</span>${v.rampa?'<span class="tag">Rampa</span>':""}${x.oc<.35?'<span class="tag warn">Sobra mucho espacio</span>':""}</div>
      </div>
      <div class="bars">
        ${barra("Peso",x.pp)}${vol?barra("Volumen",x.pv):""}
      </div>
      <div class="contact">
        <strong class="num">$${n(v.tarifa)} / día</strong>
        ${v.p.n}<br><span class="muted">${v.p.c} · ${v.p.t}</span>
      </div>
    </article>`;
  });
  if(no.length) h+=`<details><summary>${no.length} vehículos descartados</summary>${no.map(x=>`<div class="no"><span>${x.v.tipo} · ${x.v.modelo} <span class="muted">(${x.v.p.n})</span></span><span>${x.r}</span></div>`).join("")}</details>`;
  $("res").innerHTML=h;
}
function barra(t,p){return `<div class="bar"><span>${t}</span><i><b style="width:${Math.min(100,p*100)}%"></b></i><span class="num">${Math.round(p*100)}%</span></div>`}
function sugerir(q,vol){
  // vehículo activo más grande donde la carga cabe por medidas; calcula cuántos viajes harían falta
  const L=Math.max(q.l,q.a),A=Math.min(q.l,q.a);
  const c=V.filter(v=>v.activo&&L<=v.l&&A<=v.a&&q.h<=v.h&&(!q.car||v.car===q.car||(q.car==="Cerrado"&&v.car==="Refrigerado"))).sort((x,y)=>y.kg-x.kg)[0];
  if(!c) return "Revisa las medidas o quita filtros: no hay una caja donde quepa por tamaño.";
  const k=Math.ceil(Math.max(q.peso/c.kg,vol/c.vol,1));
  return k>1?`Dividiendo la carga, se podría mover en ${k} viajes (o ${k} unidades) tipo ${c.tipo} · ${c.modelo} de ${c.p.n}.`:"Prueba quitando el filtro de tipo de viaje o de rampa.";
}

function opciones(sel,items,todos){sel.innerHTML=`<option value="">${todos}</option>`+items.map(x=>`<option>${x}</option>`).join("")}
function flota(){
  const t=$("ft").value,p=$("fp").value;
  const rows=V.filter(v=>(!t||v.car===t)&&(!p||v.p.n===p));
  $("tabla").innerHTML=`<thead><tr><th>Vehículo</th><th>Proveedor</th><th>Carrocería</th><th class="r">Capacidad</th><th class="r">Caja (L × A × H)</th><th class="r">Volumen</th><th class="r">Tarimas</th><th class="r">Tarifa/día</th><th>Estado</th></tr></thead><tbody>`+
    rows.map(v=>`<tr><td><strong>${v.tipo}</strong><br><span class="muted">${v.modelo} ${v.anio} · ${v.placa}</span></td><td>${v.p.n}</td><td>${v.car}${v.rampa?" + rampa":""}</td><td class="r num">${n(v.kg)} kg</td><td class="r num">${n(v.l)} × ${n(v.a)} × ${n(v.h)} m</td><td class="r num">${n(v.vol)} m³</td><td class="r num">${v.tar||"—"}</td><td class="r num">$${n(v.tarifa)}</td><td><span class="tag ${v.activo?"ok":"warn"}">${v.activo?"Activo":"Mantenimiento"}</span></td></tr>`).join("")+"</tbody>";
  $("cuenta").textContent=`${rows.length} de ${V.length} vehículos`;
}
function proveedores(){
  $("provs").innerHTML=P.map(p=>{
    const vs=V.filter(v=>v.p===p);
    return `<article class="panel prov"><h3>${p.n}</h3>
      <dl class="kv"><dt>Contacto</dt><dd>${p.c}</dd><dt>Teléfono</dt><dd class="num">${p.t}</dd><dt>Cobertura</dt><dd>${p.z.join(", ")}</dd><dt>Pago</dt><dd>${p.pago}</dd><dt>Calificación</dt><dd class="num">${n(p.cal)} / 5</dd><dt>Flota</dt><dd class="num">${vs.length} vehículos, de ${n(Math.min(...vs.map(v=>v.kg)))} a ${n(Math.max(...vs.map(v=>v.kg)))} kg</dd></dl></article>`}).join("");
}
function ruta(){
  const v=["buscar","flota","proveedores"].includes(location.hash.slice(1))?location.hash.slice(1):"buscar";
  ["buscar","flota","proveedores"].forEach(k=>$("v-"+k).hidden=k!==v);
  document.querySelectorAll("#nav a").forEach(a=>a.getAttribute("href")==="#"+v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
}
